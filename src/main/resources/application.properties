spring.application.name=Auditing

spring.datasource.url=jdbc:postgresql://localhost:5432/auditing
spring.datasource.password=1234
spring.datasource.username=dominic
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=validate

# Flyway configuration - CRITICAL ADDITIONS
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=public

# Disable JPA's automatic schema generation
spring.jpa.generate-ddl=false
spring.jpa.defer-datasource-initialization=false 